version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://meilisearch:7700
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_REQUESTS=60
    depends_on:
      - redis
      - meilisearch
    networks:
      - search-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - search-network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey123
      - MEILI_ENV=development
    volumes:
      - meili-data:/meili_data
    networks:
      - search-network

volumes:
  redis-data:
  meili-data:

networks:
  search-network:
    driver: bridge
